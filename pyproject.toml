# Tool configuration only: the repository is not a Python package.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["data", "logs"]

[tool.ruff.lint]
# pyflakes and pycodestyle errors, import order, likely bugs (bugbear), modern syntax
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["docassistant"]
